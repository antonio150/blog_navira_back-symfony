security:
    password_hashers:
        App\Entity\Utilisateur: 'auto'

    providers:
        app_utilisateur_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            provider: app_utilisateur_provider
            custom_authenticators:
                - App\Security\UtilisateurAuthenticator

        api:
            pattern: ^/api
            stateless: true
            provider: app_utilisateur_provider
            jwt: ~
            # entry_point: jwt   # optionnel selon la version Lexik

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }        # si tu utilises API Platform docs
        - { path: ^/api/admin, roles: ROLE_ADMIN  }
            # OAuth Google
        - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10